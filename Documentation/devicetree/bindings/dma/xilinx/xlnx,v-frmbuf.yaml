%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/xilinx/xlnx,axi-frmbuf.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xilinx AXI Framebuffer DMA Controller

maintainers:
  - Tomi Valkeinen <tomi.valkeinen@ideasonboard.com>

description: |
  The Xilinx framebuffer DMA engine supports two soft IP blocks: one IP
  block is used for reading video frame data from memory (FB Read) to the
  device and the other IP block is used for writing video frame data from
  the device to memory (FB Write). Both the FB Read/Write IP blocks are
  aware of the format of the data being written to or read from memory
  including RGB and YUV in packed, planar, and semi-planar formats. Because
  the FB Read/Write is format aware, only one buffer pointer is needed by
  the IP blocks even when planar or semi-planar format are used.

  Video Format Mapping:
  The xlnx,vid-formats property uses string values that map to V4L2 and DRM
  fourcc codes as follows:

  IP FORMAT    DTS String      V4L2 Fourcc             DRM Fourcc
  -----------  --------------  ----------------------  ---------------------
  RGB8         bgr888          V4L2_PIX_FMT_RGB24      DRM_FORMAT_BGR888
  BGR8         rgb888          V4L2_PIX_FMT_BGR24      DRM_FORMAT_RGB888
  RGBX8        xbgr8888        V4L2_PIX_FMT_BGRX32     DRM_FORMAT_XBGR8888
  RGBA8        abgr8888        <not supported>         DRM_FORMAT_ABGR8888
  BGRA8        argb8888        <not supported>         DRM_FORMAT_ARGB8888
  BGRX8        xrgb8888        V4L2_PIX_FMT_XBGR32     DRM_FORMAT_XRGB8888
  RGBX10       xbgr2101010     V4L2_PIX_FMT_XBGR30     DRM_FORMAT_XBGR2101010
  RGBX12       xbgr2121212     V4L2_PIX_FMT_XBGR40     <not supported>
  RGBX16       rgb16           V4L2_PIX_FMT_BGR40      <not supported>
  YUV8         vuy888          V4L2_PIX_FMT_VUY24      DRM_FORMAT_VUY888
  YUVX8        xvuy8888        V4L2_PIX_FMT_XVUY32     DRM_FORMAT_XVUY8888
  Y_U_V8       y_u_v8          V4L2_PIX_FMT_YUV444P    DRM_FORMAT_YUV444
  Y_U_V8       y_u_v8          V4L2_PIX_FMT_YUV444M    DRM_FORMAT_YUV444
  Y_U_V10      y_u_v10         V4L2_PIX_FMT_X403       DRM_FORMAT_X403
  YUYV8        yuyv            V4L2_PIX_FMT_YUYV       DRM_FORMAT_YUYV
  UYVY8        uyvy            V4L2_PIX_FMT_UYVY       DRM_FORMAT_UYVY
  YUVA8        avuy8888        <not supported>         DRM_FORMAT_AVUY
  YUVX10       yuvx2101010     V4L2_PIX_FMT_XVUY10     DRM_FORMAT_XVUY2101010
  Y8           y8              V4L2_PIX_FMT_GREY       DRM_FORMAT_Y8
  Y10          y10             V4L2_PIX_FMT_XY10       DRM_FORMAT_Y10
  Y_UV8        nv16            V4L2_PIX_FMT_NV16       DRM_FORMAT_NV16
  Y_UV8        nv16            V4L2_PIX_FMT_NV16M      DRM_FORMAT_NV16
  Y_UV8_420    nv12            V4L2_PIX_FMT_NV12       DRM_FORMAT_NV12
  Y_UV8_420    nv12            V4L2_PIX_FMT_NV12M      DRM_FORMAT_NV12
  Y_UV10       xv20            V4L2_PIX_FMT_XV20M      DRM_FORMAT_XV20
  Y_UV10       xv20            V4L2_PIX_FMT_XV20       <not supported>
  Y_UV10_420   xv15            V4L2_PIX_FMT_XV15M      DRM_FORMAT_XV15
  Y_UV10_420   xv15            V4L2_PIX_FMT_XV20       <not supported>

allOf:
  - $ref: ../dma-controller.yaml#

properties:
  compatible:
    enum:
      - xlnx,v-frmbuf-rd-3.0
      - xlnx,v-frmbuf-wr-3.0

  "#dma-cells":
    const: 1

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1
    description: AXI Streaming clock feeding the AP_CLK

  clock-names:
    items:
      - const: ap_clk

  reset-gpios:
    maxItems: 1
    description: GPIO reset phandle

  xlnx,dma-addr-width:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [32, 64]
    description: Size of DMA address pointer in IP (either 32 or 64 bits)

  xlnx,vid-formats:
    $ref: /schemas/types.yaml#/definitions/string-array
    description:
      List of strings indicating what video memory formats the IP has been
      configured to support. See the video format mapping table above.

  xlnx,pixels-per-clock:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [1, 2, 4, 8]
    description: Pixels per clock configured in the IP

  xlnx,max-height:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 64
    maximum: 8640
    description: Maximum number of lines

  xlnx,max-width:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 64
    maximum: 15360
    description: Maximum number of pixels in a line

  xlnx,dma-align:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      DMA alignment required in bytes. Must be a power of 2 and at least
      pixels-per-clock * 8. If absent, DMA alignment is calculated as
      pixels-per-clock * 8. Minimum is 8, 16, or 32 when pixels-per-clock
      is 1, 2, or 4 respectively.

  xlnx,fid:
    type: boolean
    description:
      Field ID enabled for interlaced video support. Can be absent for
      progressive video.

required:
  - compatible
  - "#dma-cells"
  - reg
  - interrupts
  - clocks
  - clock-names
  - xlnx,dma-addr-width
  - xlnx,vid-formats
  - xlnx,pixels-per-clock
  - xlnx,max-height
  - xlnx,max-width

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    v_frmbuf_rd_0: dma-controller@80000000 {
        #dma-cells = <1>;
        compatible = "xlnx,axi-frmbuf-rd-v2.1";
        interrupt-parent = <&gic>;
        interrupts = <0 92 4>;
        reset-gpios = <&gpio 80 GPIO_ACTIVE_HIGH>;
        reg = <0x80000000 0x10000>;
        xlnx,dma-addr-width = <32>;
        xlnx,vid-formats = "bgr888", "xbgr8888";
        xlnx,pixels-per-clock = <1>;
        xlnx,dma-align = <8>;
        xlnx,max-width = <3840>;
        xlnx,max-height = <2160>;
        clocks = <&vid_stream_clk>;
        clock-names = "ap_clk";
    };

  - |
    #include <dt-bindings/gpio/gpio.h>

    v_frmbuf_wr_0: dma-controller@80010000 {
        #dma-cells = <1>;
        compatible = "xlnx,axi-frmbuf-wr-v2.1";
        interrupt-parent = <&gic>;
        interrupts = <0 93 4>;
        reset-gpios = <&gpio 80 GPIO_ACTIVE_HIGH>;
        reg = <0x80010000 0x10000>;
        xlnx,dma-addr-width = <64>;
        xlnx,vid-formats = "bgr888", "yuyv", "nv16", "nv12";
        xlnx,pixels-per-clock = <2>;
        xlnx,dma-align = <16>;
        xlnx,max-width = <3840>;
        xlnx,max-height = <2160>;
        clocks = <&vid_stream_clk>;
        clock-names = "ap_clk";
    };
