%YAML 1.2
---
$id: http://devicetree.org/schemas/media/raspberrypi,rp1-cfe.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Raspberry Pi PiSP Camera Front End

maintainers:
  - Dave Stevenson <dave.stevenson@raspberrypi.com>
  - David Plowman <david.plowman@raspberrypi.com>
  - Naushir Patuck <naush@raspberrypi.com>
  - Nick Hollinghurst <nick.hollinghurst@raspberrypi.com>
  - Tomi Valkeinen <tomi.valkeinen@ideasonboard.com>

description: |
  The Raspberry Pi PiSP Camera Front End is a MIPI CSI-2 receiver with a simple
  image processor.

  The full ISP documentation is available at:
  https://datasheets.raspberrypi.com/camera/raspberry-pi-image-signal-processor-specification.pdf

  The CSI-2 receiver part has no public documentation.

properties:
  compatible:
    const: raspberrypi,rp1-cfe

  reg:
    items:
      - description: CSI-22
      - description: D-PHY
      - description: MIPI CFG
      - description: FE

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            minItems: 1
            maxItems: 4

          clock-lanes:
            maxItems: 1

          clock-noncontinuous: true

           # XXX what is this: multipacket-line

        required:
          - clock-lanes
          - data-lanes

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    #include <dt-bindings/mfd/rp1.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/clock/rp1.h>

    rpi1 {
        #address-cells = <2>;
        #size-cells = <2>;

      csi@110000 {
        compatible = "raspberrypi,rp1-cfe";
        reg = <0xc0 0x40110000  0x0 0x100>,
              <0xc0 0x40114000  0x0 0x100>,
              <0xc0 0x40120000  0x0 0x100>,
              <0xc0 0x40124000  0x0 0x1000>;

        interrupts = <RP1_INT_MIPI0 IRQ_TYPE_LEVEL_HIGH>;

        clocks = <&rp1_clocks RP1_CLK_MIPI0_CFG>;

        port {
          csi_ep: endpoint {
            remote-endpoint = <&cam_endpoint>;
            clock-lanes = <0>;
            data-lanes = <1 2>;
          };
        };
      };
    };
